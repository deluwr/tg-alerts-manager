name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile app/app.py
          for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - name: Install and exercise on a clean machine
        run: sudo bash scripts/ci-test.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/tg-alerts-manager.tar.gz
            dist/tg-alerts-manager.tar.gz.sha256
            dist/install.sh
